apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
        - name: demo-app
          image: ghcr.io/shakirmir/argocd-gitops-lab:3769a6e64e4a82b19be741447f714fba54b0946f
          ports:
            - containerPort: 3000