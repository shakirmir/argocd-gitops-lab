apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
        - name: demo-app
          image: ghcr.io/shakirmir/argocd-gitops-lab:f14d9f22df1105c966c8098f78d13c4773841c82
          ports:
            - containerPort: 3000