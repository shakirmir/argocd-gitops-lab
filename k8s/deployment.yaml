apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
        - name: demo-app
          image: ghcr.io/shakirmir/argocd-gitops-lab:4b010a790f79ebdbe6fe2b7d1fac75cbfe2408b6
          ports:
            - containerPort: 3000