apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
        - name: demo-app
          image: ghcr.io/shakirmir/github-actions-argocd-kind:initial
          ports:
            - containerPort: 3000